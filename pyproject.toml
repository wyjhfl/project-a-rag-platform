[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-a-rag-platform"
version = "1.0.0"
description = "Equipment after-sales diagnosis and ticket workflow RAG platform."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "numpy>=2.3,<2.4",
    "protobuf>=6,<7",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
demo = [
    "gradio>=5.0.0",
]
cache = [
    "redis>=5.0.0",
]
postgres = [
    "psycopg[binary,pool]>=3.2.0",
]
vector = [
    "pymilvus>=2.5.0",
]
graph = [
    "neo4j>=5.20.0",
]
multimodal = [
    "mineru>=3.1.13",
    "paddleocr>=3.5.0",
    "paddlepaddle>=3.3.1",
]
full = [
    "gradio>=5.0.0",
    "redis>=5.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pymilvus>=2.5.0",
    "neo4j>=5.20.0",
    "mineru>=3.1.13",
    "paddleocr>=3.5.0",
    "paddlepaddle>=3.3.1",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []
